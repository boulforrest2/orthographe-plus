
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Orthographe+ - Test fenêtres</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
    }

    button {
      font-size: 20px;
      padding: 18px 28px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Orthographe+</h1>
  <p>Test de fenêtres côte à côte</p>

  <button onclick="ouvrirFenetres()">
    Commencer ma séance
  </button>

  <script>
    function ouvrirFenetres() {

      const gauche = screen.availLeft || 0;
      const haut = screen.availTop || 0;
      const largeurTotale = screen.availWidth;
      const hauteurTotale = screen.availHeight;

      const largeurGauche = Math.floor(largeurTotale / 2);
      const largeurDroite = largeurTotale - largeurGauche;

      const optionsGauche =
        `popup=yes,left=${gauche},top=${haut},` +
        `width=${largeurGauche},height=${hauteurTotale}`;

      const optionsDroite =
        `popup=yes,left=${gauche + largeurGauche},top=${haut},` +
        `width=${largeurDroite},height=${hauteurTotale}`;

      const fenetreGauche = window.open(
        "https://boulforrest2.github.io/orthographe-plus/",
        "OrthographeManipulation",
        optionsGauche
      );

      const fenetreDroite = window.open(
        "https://chatgpt.com/",
        "OrthographeChatGPT",
        optionsDroite
      );

      if (!fenetreGauche || !fenetreDroite) {
        alert("Une fenêtre a été bloquée par le navigateur.");
      }
    }
  </script>

</body>
</html>
