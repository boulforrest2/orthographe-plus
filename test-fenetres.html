
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test Orthographe+ - Deux fenêtres</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
    }
    button {
      font-size: 20px;
      padding: 18px 28px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Orthographe+</h1>
  <p>Test d'ouverture de deux fenêtres</p>

  <button onclick="ouvrirFenetres()">
    Commencer ma séance
  </button>

  <script>
    function ouvrirFenetres() {
      const largeur = Math.floor(screen.availWidth / 2);
      const hauteur = screen.availHeight;

      const gauche = screen.availLeft || 0;
      const haut = screen.availTop || 0;

      const fenetre1 = window.open(
        "https://boulforrest2.github.io/orthographe-plus/",
        "OrthographeManipulation",
        `popup=yes,left=${gauche},top=${haut},width=${largeur},height=${hauteur}`
      );

      const fenetre2 = window.open(
        "https://chatgpt.com/",
        "OrthographeChatGPT",
        `popup=yes,left=${gauche + largeur},top=${haut},width=${largeur},height=${hauteur}`
      );

      if (!fenetre1 || !fenetre2) {
        alert("Autorise les fenêtres pop-up pour ce site, puis réessaie.");
      }
    }
  </script>

</body>
</html>
